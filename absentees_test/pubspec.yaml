name: Absentees
description: "A new Flutter project."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.4


dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8
  provider: ^6.1.2
  sqflite: ^2.4.1
  shared_preferences: ^2.3.5
  path: ^1.9.0
  carousel_slider: ^5.0.0
  pie_chart: ^5.4.0
  sliding_clipped_nav_bar: ^3.1.1
  http: ^1.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # To add assets to your application, add an assets section, like this:
  assets:
    - assets/images/
  #   - images/a_dot_ham.jpeg


  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto.ttf
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic

    - family: ConcertOne
      fonts:
        - asset: assets/fonts/ConcertOne-Regular.ttf

